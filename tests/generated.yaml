- vars:
    prompt: >-
      Pull all Clover transactions from the past 14 days, categorize them by
      product type, and write the totals into a Google Sheet called
      Clover_Sales_Breakdown under the tab Weekly_Summary starting at cell A1.
- vars:
    prompt: >-
      Check our Plaid-linked savings account balance right now and compare it
      to cell C4 labeled 'Reserve Target' in the Google Sheet named
      Cash_Reserves. Tell me if we are above or below target and by how much.
- vars:
    prompt: >-
      Fetch this month's Shopify refunds total and this month's Square refunds
      total, combine them, then email me a refund summary report to
      owner@mybusiness.com with subject line 'Monthly Refund Report'.
- vars:
    prompt: >-
      Give me Plaid's projected cash flow for the next 6 months based on our
      transaction history and post the forecast to Discord channel
      #finance-team.
- vars:
    prompt: >-
      Pull yesterday's Clover sales by employee, rank them highest to lowest,
      and send the ranked list via WhatsApp to my number so I can review team
      performance before the morning meeting.
- vars:
    prompt: >-
      Read the vendor list from column A of the Google Sheet Vendor_Master.
      For each vendor, search Plaid transactions from the last 60 days for
      matching payments. If no match is found for a vendor, flag it in column
      B as 'No Payment Found'.
- vars:
    prompt: >-
      Sync last week's QuickBooks expense entries into the Google Sheet named
      QB_Expense_Tracker under tab Week_Import starting at row 2, then post a
      Discord message to #bookkeeping-alerts confirming how many rows were
      written.
- vars:
    prompt: >-
      Pull Plaid transactions for account ID acc_ghost_00X from the last 7
      days. If the account returns an error or no data, log the failure with a
      timestamp in cell A1 of the sheet Error_Log_2024 and notify #dev-alerts
      on Discord immediately.
- vars:
    prompt: >-
      Pull all Clover transactions from the past 14 days, categorize them by
      product type, and write the totals into a Google Sheet called
      Sales_Breakdown under the tab Clover_Summary starting at cell B3. Then
      email me a copy of the summary at my business address.
- vars:
    prompt: >-
      Fetch next quarter's projected cash inflows directly from Plaid for our
      savings account and post the forecast to Discord channel
      #finance-planning.
- vars:
    prompt: >-
      Read the vendor list from column A of the Google Sheet Approved_Vendors
      tab Sheet1, cross-reference it against last 30 days of Plaid
      transactions, flag any payments to unlisted vendors, and send a WhatsApp
      alert to my business number listing each flagged transaction.
- vars:
    prompt: >-
      Pull today's Shopify and Clover sales totals, subtract the QuickBooks
      recorded revenue figure for today from cell C5 in sheet
      Daily_Reconciliation, and if the variance exceeds $200 send a Discord
      alert to #finance-ops with the exact discrepancy amount.

description: >
  Meztli AI Assistant — business workspace agent with Plaid (banking), Google
  Sheets, Discord, Shopify, Square, Clover, WhatsApp, email, and QuickBooks
  connectors. Users ask natural-language questions about cash flow,
  reconciliation, expenses, alerts, and multi-step workflows across connectors.
  Live UI: https://www.meztli.ai/assistant — Promptfoo hits chat HTTP (Render
  by default, or frontend /api/proxy/api/chat). Output is unwrapped to plain
  assistant text via transforms/chat-response.js.
providers:
  - id: http
    config:
      url: https://miraai-backend1.onrender.com/api/chat
      method: POST
      # Auth headers rewritten by scripts/lib.sh (Clerk JWT live; X-Eval-Key only if local).
      headers:
        Content-Type: application/json
        Authorization: "Bearer {{env.MEZTLI_EVAL_CLERK_JWT}}"
      body:
        message: "{{prompt}}"
        clientSessionId: promptfoo-{{testIdx}}
        timezone: America/Chicago
      # Live assistant turns (tools) can exceed default HTTP timeouts.
      # promptfoo 0.123's http provider actually uses REQUEST_TIMEOUT_MS
      # (exported by scripts/lib.sh, default 300000); timeoutMs is kept for
      # newer versions that honor it.
      timeoutMs: 300000
      # Default is 4 retries (incl. timeouts) — each retry can burn plan quota.
      maxRetries: 1
      # Unwrap nested/stringified data→result→output to plain assistant text.
      # Surfaces PLAN_LIMIT/auth errors instead of crashing on missing .output.
      # Must be file:// — inline expressions cannot use `const` / statements.
      transformResponse: file://transforms/chat-response.js
# Bare user message only — Meztli system instructions live in the backend,
# not concatenated into the chat `message` body (which shows up in the UI).
prompts:
  - "{{prompt}}"
# Shared multi-dimension rubrics (see asserts/default.yaml + README).
defaultTest: file://asserts/default.yaml
tests:
  - file://tests/generated.yaml
